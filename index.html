
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لباس - سوق الملابس</title>
<style>
body{margin:0;font-family:Arial;background:#f4f5f4;color:#222}
header{background:#183c32;color:white;text-align:center;padding:28px 12px}
main{max-width:900px;margin:auto;padding:18px}
input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ccc;border-radius:9px;font-size:16px;margin-bottom:18px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px}
.item{background:white;border-radius:10px;padding:14px}
.pic{background:#e5eee8;text-align:center;padding:24px;font-size:42px;border-radius:8px}
.price{color:#16764a;font-weight:bold}
footer{text-align:center;padding:25px;color:#666}
</style>
</head>
<body>
<header>
<h1>🛍️ لباس</h1>
<p>سوقك لبيع وشراء الملابس في المغرب</p>
</header>
<main>
<h2>اكتشف الملابس</h2>
<input id="search" placeholder="ابحث عن الملابس..." aria-label="البحث">
<div class="products">
<div class="item"><div class="pic">👕</div><h3>قميص أنيق</h3><p>المقاس: M</p><p class="price">80 درهم</p></div>
<div class="item"><div class="pic">👖</div><h3>سروال جينز</h3><p>المقاس: L</p><p class="price">120 درهم</p></div>
<div class="item"><div class="pic">👟</div><h3>حذاء رياضي</h3><p>المقاس: 42</p><p class="price">150 درهم</p></div>
<div class="item"><div class="pic">🧥</div><h3>سترة شتوية</h3><p>المقاس: M</p><p class="price">200 درهم</p></div>
</div>
</main>
<footer>لباس © 2026</footer>
<script>
document.getElementById('search').addEventListener('input',function(){
document.querySelectorAll('.item').forEach(function(item){
item.hidden=!item.innerText.toLowerCase().includes(document.getElementById('search').value.trim().toLowerCase());
});
});
</script>
</body>
</html>
